<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7f5ec"/>
      <stop offset="100%" stop-color="#a9dcbe"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <circle cx="90" cy="100" r="130" fill="#24402f" opacity="0.06"/>
  <circle cx="690" cy="500" r="150" fill="#ffffff" opacity="0.25"/>

  <!-- solar panel -->
  <g transform="translate(430,280) rotate(-8)">
    <rect x="0" y="0" width="260" height="160" rx="8" fill="#24402f"/>
    <g stroke="#e7f5ec" stroke-width="3">
      <line x1="0" y1="40" x2="260" y2="40"/>
      <line x1="0" y1="80" x2="260" y2="80"/>
      <line x1="0" y1="120" x2="260" y2="120"/>
      <line x1="65" y1="0" x2="65" y2="160"/>
      <line x1="130" y1="0" x2="130" y2="160"/>
      <line x1="195" y1="0" x2="195" y2="160"/>
    </g>
    <rect x="0" y="0" width="260" height="160" rx="8" fill="none" stroke="#3f8f61" stroke-width="6"/>
  </g>
  <line x1="470" y1="440" x2="470" y2="480" stroke="#24402f" stroke-width="8"/>
  <line x1="610" y1="410" x2="610" y2="480" stroke="#24402f" stroke-width="8"/>

  <!-- battery / leaf -->
  <g transform="translate(120,340)">
    <rect x="0" y="0" width="90" height="150" rx="14" fill="#ffffff" stroke="#24402f" stroke-width="5"/>
    <rect x="28" y="-16" width="34" height="18" rx="4" fill="#24402f"/>
    <rect x="10" y="95" width="70" height="40" rx="6" fill="#3f8f61"/>
    <path d="M45 20 C 75 40 75 80 45 95 C 15 80 15 40 45 20 Z" fill="#3f8f61" opacity="0.85"/>
  </g>

  <text x="60" y="120" font-family="Georgia, serif" font-size="30" font-weight="600" fill="#1f3a2b">CESECO</text>
  <text x="60" y="152" font-family="Georgia, serif" font-size="20" font-weight="500" fill="#1f3a2b">Clean Energy Program</text>
  <text x="60" y="182" font-family="Arial, sans-serif" font-size="18" fill="#2d5a41">2026</text>
</svg>
